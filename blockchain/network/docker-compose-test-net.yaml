version: '3.7'

networks:
  satsa_network:
    name: SENTRA-network

services:
  orderer.supervisor.SENTRA:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.supervisor.SENTRA
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=SupervisorOrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=false
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    ports:
      - 7050:7050
    networks:
      - satsa_network

  peer0.csea.SENTRA:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.csea.SENTRA
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=SENTRA-network
      - CORE_PEER_ID=peer0.csea.SENTRA
      - CORE_PEER_ADDRESS=peer0.csea.SENTRA:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.csea.SENTRA:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.csea.SENTRA:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.csea.SENTRA:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ENABLED=false
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 7051:7051
    networks:
      - satsa_network

  peer0.cseb.SENTRA:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.cseb.SENTRA
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=SENTRA-network
      - CORE_PEER_ID=peer0.cseb.SENTRA
      - CORE_PEER_ADDRESS=peer0.cseb.SENTRA:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.cseb.SENTRA:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_TLS_ENABLED=false
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 9051:9051
    networks:
      - satsa_network
